services:
  - type: web
    name: invoice-app-fra
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS eu-central-1, Frankfurt): closest to South African users.
    # Render cannot move an existing service, so this creates a new one; delete the old Oregon one once this works.
    region: frankfurt
    branch: v3
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Neon connection string, set in the Render dashboard (the app will not start without it).
      # Use Neon's DIRECT (non-pooled) string: migrations run at startup and take a Postgres advisory lock,
      # which does not work reliably through the pooler. The app adds the psycopg driver prefix itself.
      - key: DATABASE_URL
        sync: false
      # Render's proxy appends the client address to X-Forwarded-For: trust exactly one hop (verify after deploy)
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Public demo: several visitors may share one IP, so allow more auth attempts than the default
      - key: AUTH_RATE_LIMIT
        value: "30"
