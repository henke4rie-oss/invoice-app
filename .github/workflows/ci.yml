name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://invoice:invoice@localhost:5432/invoice_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend tests (deprecation warnings are errors)
        working-directory: backend
        run: python -m pytest -q -W error::DeprecationWarning

      - name: Frontend scripts parse
        run: |
          python3 - "$RUNNER_TEMP" <<'EOF'
          import pathlib, re, sys
          html = pathlib.Path("frontend/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) >= 2, "expected the head theme script and the app script"
          for i, body in enumerate(scripts):
              pathlib.Path(sys.argv[1], f"script{i}.js").write_text(body)
          EOF
          for f in "$RUNNER_TEMP"/script*.js; do node --check "$f"; done
