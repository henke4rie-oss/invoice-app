# Local development services.
#   docker compose up -d db        # Postgres for the app (database "invoice")
# The test suite creates and uses its own database ("invoice_test") on the same server.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "5433:5432"  # host port 5433: 5432 is often taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
